name: Build Ashenveil Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pygame pyinstaller
      - name: Download game assets
        shell: bash
        run: |
          mkdir -p assets
          curl -L "https://files.manuscdn.com/user_upload_by_module/session_file/310519663929702223/FPhpcBmgqimQHMzI.png" -o assets/vesper.png
          curl -L "https://files.manuscdn.com/user_upload_by_module/session_file/310519663929702223/uyLkKRxduKOXEzon.png" -o assets/myr.png
          curl -L "https://files.manuscdn.com/user_upload_by_module/session_file/310519663929702223/OqNVYHROCuTpOhyP.png" -o assets/orun.png
          curl -L "https://files.manuscdn.com/user_upload_by_module/session_file/310519663929702223/PqQlIYQMavABBIKl.png" -o assets/nox.png
          curl -L "https://files.manuscdn.com/user_upload_by_module/session_file/310519663929702223/GVzUfZpjjQtxXQct.png" -o assets/cinder_sister.png
          curl -L "https://files.manuscdn.com/user_upload_by_module/session_file/310519663929702223/BPHCbORbrBVEpZpj.png" -o assets/sanctuary_bg.png
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Ashenveil --add-data "assets;assets" ashenveil.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Ashenveil-Windows
          path: dist/Ashenveil.exe
